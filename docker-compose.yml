version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ai_superbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: ai_superbot_api
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8000"
    entrypoint: ["/bin/bash", "docker/entrypoint_api.sh"]
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 10s
      timeout: 3s
      retries: 30
    dns:
      - 1.1.1.1
      - 8.8.8.8

  bot:
    build: .
    container_name: ai_superbot_bot
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    entrypoint: ["/bin/bash", "docker/entrypoint_bot.sh"]
    volumes:
      - ./fonts/ARIALBD.TTF:/app/fonts/ARIALBD.TTF:ro
    dns:
      - 1.1.1.1
      - 8.8.8.8

volumes:
  db_data:
