version: "3.9"

services:
  db:
    image: postgres:16
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always

  api:
    build: .
    container_name: ai_superbot_api
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8000"
    entrypoint: ["/bin/bash", "docker/entrypoint_api.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  bot:
    build: .
    container_name: ai_superbot_bot
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    entrypoint: ["/bin/bash", "docker/entrypoint_bot.sh"]
    healthcheck:
      disable: true
    volumes:
      - ./fonts/ARIALBD.TTF:/app/fonts/ARIALBD.TTF:ro
    restart: always


  backup_service:
    build: ./backup_service
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - ADMIN_CHAT_ID=847867090
    restart: always

volumes:
  db_data: